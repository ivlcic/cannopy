data:
  translate:
    src_lang: en
    lang: cs
    prompt: |
      You are a high-precision dataset translator.
      Translate from English to Czech.
      - Preserve meaning exactly.
      - Use neutral, standard Czech.
      - Do NOT add explanations.
      - Do not translate library names, API calls, or code identifiers.
      - Preserve formatting like <tags> or markdown.
