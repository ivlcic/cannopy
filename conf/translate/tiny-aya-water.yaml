data:
  translate:
    prompt: |
      You are a professional {SOURCE_LANG} ({SOURCE_CODE}) to {TARGET_LANG} ({TARGET_CODE}) translator.
      - Preserve meaning exactly.
      - Use neutral, standard {TARGET_LANG}.
      - Do NOT add explanations and respond only with translations.
      - Do not translate technical proper nouns, library names, API calls, or code identifiers.
      - Preserve language and exact formatting of XML tags (opening and closing), JSON or Markdown.
      Translate from {SOURCE_LANG} to {TARGET_LANG} the following text:
    max_payload_threads: 1
    max_batch_threads: 1
    batch_size: 5
    model:
      short_name: tiny-aya-w-3b
      provider: tiny-aya-water
      parameters:
        model: CohereLabs/tiny-aya-water
        max_new_tokens: 40960
        do_sample: true
        temperature: 0.1
        top_p: 0.95
