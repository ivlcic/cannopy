data:
  dataset_name: iptc-31
  split:
    train: 0.8
    eval: 0.1
    test: 0.1
    seed: 2611
  sampling:
    attributes:
      dist_metric: ip
      hnsw_m: 32
      hnsw_ef_construction: 200
      hnsw_ef_search: 128
  source:
    links:
      - url: https://kt-cloud.ijs.si/index.php/s/9NiTfGpDb92NWs3/download?path=%2F&files=news_class_dataset.zip
    attributes:
      languages: [hr, mk, sl, sr]
  attributes:
    # Original train/test files are preserved by the downloader.
    # IPTC Media Topics: https://cv.iptc.org/newscodes/mediatopic/
    # Codes must remain strings to preserve leading zeros.
    labels:
      - label_id: 1
        label_name: "arts, culture, entertainment and media"
        iptc_code: "01000000"
        iptc_qcode: "medtop:01000000"
        iptc_uri: "http://cv.iptc.org/newscodes/mediatopic/01000000"
