# IPTC-31 multilingual, multilabel news dataset.
# Languages: hr (Croatian), mk (Macedonian), sr (Serbian), sl (Slovene).
#
# Download preserves the archive's eight <lang>_<train|test>.jsonl files under
# result/data/download/iptc-31/ with their original records and filenames.
# Preparation writes iptc-31.<lang>.<train|test>.jsonl and
# iptc-31.<lang>.labels.csv under result/data/prepare/iptc-31/.
# Prepared labels are IPTC code strings; sample IDs are prefixed with language
# to avoid collisions. Original annotations and train/test assignments remain.
# Label counts and optional source.select.filter.min_label_count filtering
# are computed per language across its train and test splits.
#
# Embedding requires a language config (-c hr/mk/sr/sl) and a model config.
# Outputs under result/data/embed/iptc-31/ use the stem
# iptc-31.<lang>.<model>.<train|test>, with .jsonl vectors, normalized .npz
# sidecars, and .stats.jsonl performance measurements. Sidecars contain IDs,
# embeddings, label code lists, and encoded label vectors in CSV label order.
# Language configs also restrict download and prepare to that language.
#
# Classification settings and implementation notes: sequence/iptc-31.yaml.
data:
  dataset_name: iptc-31
  split:
    # Download and prepare retain the archive splits; these ratios do not
    # resplit the dataset or create an evaluation split during preparation.
    train: 0.8
    eval: 0.1
    test: 0.1
    seed: 2611
  sampling:
    attributes:
      dist_metric: ip
      hnsw_m: 32
      hnsw_ef_construction: 200
      hnsw_ef_search: 128
  source:
    links:
      - url: https://kt-cloud.ijs.si/index.php/s/9NiTfGpDb92NWs3/download?path=%2F&files=news_class_dataset.zip
    attributes:
      languages: [hr, mk, sl, sr]
  attributes:
    # Original train/test files are preserved by the downloader.
    # IPTC Media Topics: https://cv.iptc.org/newscodes/mediatopic/
    # Codes must remain strings to preserve leading zeros.
    # Official definitions, copyright IPTC, used under CC BY 4.0.
    # Original dataset label names and codes are retained.
    label_description_metadata:
      source_url: "https://cv.iptc.org/newscodes/mediatopic/?format=json&lang=en-US"
      release_date: "2026-09-30T12:00:00+00:00"
      retrieved_date: "2026-11-16"
      language: "en-US"
      copyright: "IPTC, International Press Telecommunications Council - https://iptc.org"
      license_url: "https://creativecommons.org/licenses/by/4.0/"
    labels:
      - label_id: 1
        label_name: "arts, culture, entertainment and media"
        label_description: "All forms of arts, entertainment, cultural heritage and media"
        iptc_code: "01000000"
        iptc_qcode: "medtop:01000000"
        iptc_uri: "http://cv.iptc.org/newscodes/mediatopic/01000000"
