# Character 3-5-grams within word boundaries. Fit vocabulary and IDF on each
# language's training text, then transform test text. Methods: svm and log_reg.
model:
  short_name: tfidf-char
data:
  attributes:
    sequence:
      features:
        type: tfidf
        analyzer: char_wb
        ngram_range: [3, 5]
        min_df: 2
        max_features: 100000
        sublinear_tf: true
        norm: l2
