# Word unigrams/bigrams. Fit vocabulary and IDF on each language's training
# text, then transform test text. Supported methods: svm and log_reg.
model:
  short_name: tfidf-word
data:
  attributes:
    sequence:
      features:
        type: tfidf
        analyzer: word
        ngram_range: [1, 2]
        min_df: 2
        max_features: 100000
        sublinear_tf: true
        norm: l2
