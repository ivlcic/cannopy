model:
  max_seq_length: 256

train:
  learning_rate: 0.000005 # 5e-6
  num_train_epochs: 20
  eval_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  optim: adamw_torch
  save_total_limit: 5
  metric_for_best_model: 'f1'
  logging_strategy: epoch
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  seed: 2611
