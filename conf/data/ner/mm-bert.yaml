model:
  max_seq_length: 256
  attn_implementation: flash_attention_2
  dtype: float16

train:
  learning_rate: 0.00002 # 2e-5
  num_train_epochs: 40
  eval_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  optim: adamw_torch
  save_total_limit: 5
  metric_for_best_model: 'f1'
  logging_strategy: epoch
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32
  seed: 2611
